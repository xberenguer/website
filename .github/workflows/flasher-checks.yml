name: Flasher checks
on:
  push:
    paths: ['flasher/**', '.github/workflows/flasher-checks.yml']
  pull_request:
    paths: ['flasher/**', '.github/workflows/flasher-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check signed catalog, binaries, protected ranges and recovery
        run: node --test flasher/tests/*.test.js
