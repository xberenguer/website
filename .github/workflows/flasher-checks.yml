name: Flasher checks
on:
  push:
    paths: ['flasher/**', '.github/workflows/flasher-checks.yml', '.github/workflows/phoenix-release-sync.yml']
  pull_request:
    paths: ['flasher/**', '.github/workflows/flasher-checks.yml', '.github/workflows/phoenix-release-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check signed catalog, binaries, protected ranges and recovery
        run: node --test flasher/tests/*.test.js
      - name: Check release sync and signed update rejection
        run: python3 -m unittest discover -s flasher/tests -p 'test_*.py'
