name: Sync signed Phoenix release

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: phoenix-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage the latest signed public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e "$RUNNER_TEMP/phoenix-flasher-stage"
          python3 flasher/scripts/consume-phoenix.py --stage "$RUNNER_TEMP/phoenix-flasher-stage"
      - name: Apply the verified catalog and firmware
        id: apply
        run: |
          if [ -d "$RUNNER_TEMP/phoenix-flasher-stage/flasher" ]; then
            cp -a "$RUNNER_TEMP/phoenix-flasher-stage/flasher/." flasher/
          fi
          if git diff --quiet -- flasher/catalog.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check signatures, images, protected ranges and recovery
        run: |
          node --test flasher/tests/*.test.js
          python3 -m unittest discover -s flasher/tests -p 'test_*.py'
      - name: Publish the verified update
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flasher/catalog.json flasher/catalog.sig flasher/firmware/SHA256SUMS flasher/firmware/phoenix-*.bin
          git commit -m 'Sync Phoenix firmware from signed release'
          git push origin HEAD:main
      - name: Request the Pages build
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
